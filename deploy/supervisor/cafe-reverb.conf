; Keeps the Reverb WebSocket server running (restarts it if it crashes or after a reboot).
; Copy to /etc/supervisor/conf.d/, fix the paths / user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
; After each deploy: php artisan reverb:restart (Supervisor starts it again with the new code).

[program:cafe-reverb]
process_name=%(program_name)s
command=php /var/www/cafe-manager/artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
directory=/var/www/cafe-manager
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
; Each open WebSocket uses a file descriptor.
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/cafe-manager/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
