# Nginx site for Cafe Manager with Laravel Reverb behind the same domain (wss://cafe.example.com).
# Copy to /etc/nginx/sites-available/, replace cafe.example.com, the paths and the PHP-FPM socket,
# then: ln -s ../sites-available/cafe-manager.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS certificates: certbot --nginx -d cafe.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cafe.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cafe.example.com;

    ssl_certificate     /etc/letsencrypt/live/cafe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafe.example.com/privkey.pem;

    root /var/www/cafe-manager/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Reverb: browsers connect to /app/{key} (WebSocket), Laravel publishes to /apps/{id}/events (HTTP).
    # Both go to the Reverb server listening on 127.0.0.1:8080 (REVERB_SERVER_HOST / REVERB_SERVER_PORT).
    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;

        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
